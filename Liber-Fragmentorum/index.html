<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script>
        // HTMLの解析が始まった瞬間に、最速で画面を切り替える
        window.location.replace("../liber-fragmentorum.html");
    </script>

    <!-- 0秒後に、1つ上の階層（../）へ自動転送 -->
    <meta http-equiv="refresh" content="0; URL=../liber-fragmentorum.html">
    <title>Redirecting...</title>
</head>
<body>
    <p>移動しています。自動で切り替わらない場合は <a href="../">こちら</a> をクリックしてください。</p>
</body>
</html>
